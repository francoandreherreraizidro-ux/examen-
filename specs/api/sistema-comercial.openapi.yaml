components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RNF-SEC-002 exige autenticación y autorización por roles. Emisor,
        audiencia, claims, scopes y correspondencia rol-operación están
        pendientes de confirmación; no se fijan credenciales ni proveedor.
  parameters:
    Page:
      name: page
      in: query
      description: Número de página, comenzando en 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Máximo de resultados por página; límite propuesto sujeto a validación.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave para evitar repetir una mutación. Retención y formato final pendientes; reutilizar con payload distinto debe producir conflicto.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SupplierId:
      name: supplierId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SaleId:
      name: saleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    CommonErrors:
      description: |
        Errores comunes retornados como application/problem+json. Los códigos
        posibles son 400 (payload inválido), 401 (no autenticado), 403 (sin
        autorización) y 500 (error interno). Las operaciones también declaran
        respuestas específicas como 404, 409 y 422 cuando corresponden.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso inexistente
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Recurso no encontrado
            status: 404
            detail: No se encontró el recurso solicitado.
            code: NOT_FOUND
    Conflict:
      description: Conflicto de estado, duplicidad o concurrencia
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflicto
            status: 409
            detail: La operación entra en conflicto con el estado actual del recurso.
            code: CONFLICT
    BusinessRuleViolation:
      description: Regla de negocio incumplida; el código específico se define tras validar las reglas.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Regla de negocio incumplida
            status: 422
            detail: La operación no puede completarse con el estado actual.
            code: BUSINESS_RULE_VIOLATION
    IdempotentReplay:
      description: Reintento idempotente de una solicitud ya procesada.
      headers:
        Idempotency-Replayed:
          schema:
            type: boolean
          description: Indica que la respuesta corresponde al resultado almacenado de la solicitud original.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericSuccess'
  schemas:
    Pagination:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    Problem:
      type: object
      description: Problem Details con código de aplicación opcional; no se exponen secretos ni datos internos.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Código estable de aplicación; no es un código de rechazo SUNAT salvo que la respuesta externa lo provea.
        invalidParams:
          type: array
          items:
            type: object
            required: [name, reason]
            properties:
              name:
                type: string
              reason:
                type: string
      required: [title, status]
    GenericSuccess:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
    ResponseMetadata:
      type: object
      properties:
        correlationId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    CrearProductoComandoDto:
      type: object
      x-source-dto: 03_DTOs_Schemas/dtos_schemas.md#CrearProductoComandoDto
      required: [sku, nombre, categoriaId, unidadMedida, afectacionIgvDefecto, esPerecible, escalasPrecioIniciales]
      properties:
        sku:
          type: string
          minLength: 3
          maxLength: 50
        codigoBarras:
          type: string
        nombre:
          type: string
          minLength: 1
          maxLength: 255
        descripcion:
          type: string
        categoriaId:
          type: string
          format: uuid
        unidadMedida:
          type: string
          description: Código del catálogo de unidades vigente; valores específicos por verificar.
        codigoSunat:
          type: string
        afectacionIgvDefecto:
          type: string
          description: Código de afectación pendiente de cotejo con catálogo vigente.
        esPerecible:
          type: boolean
        escalasPrecioIniciales:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EscalaPrecioEntrada'
      additionalProperties: false
    EscalaPrecioEntrada:
      type: object
      required: [tipoEscala, cantidadMinima, precioUnitarioConIgv, moneda, fechaInicio]
      properties:
        tipoEscala:
          type: string
        cantidadMinima:
          type: number
