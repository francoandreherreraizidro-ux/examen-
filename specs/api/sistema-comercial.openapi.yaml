openapi: 3.1.0
info:
  title: API del sistema comercial
  version: 0.1.0
  summary: Borrador de contratos REST para el sistema comercial
  description: |
    PROPUESTA DRAFT. SPEC-002 y los requisitos base siguen en DRAFT; el modelo
    conceptual y los DTOs existentes presentan divergencias. Este documento no
    congela contratos ni afirma cumplimiento tributario. Los elementos
    marcados x-status: proposed o x-pending requieren validación antes de
    aprobarse. No se fija un host de producción.
  x-status: DRAFT
  x-parent-spec: SPEC-002
servers:
  - url: /
    description: Host y despliegue pendientes de confirmación
tags:
  - name: Catalogo
  - name: Inventario
  - name: Directorio
  - name: Ventas
  - name: Comprobantes
  - name: Migracion
security:
  - bearerAuth: []
paths:
  /api/v1/catalog/categories:
    get:
      operationId: listarCategorias
      tags: [Catalogo]
      summary: Listar categorías
      description: Consulta de categorías existentes; no se especifica alta o edición de categorías en los requisitos actuales.
      x-requirements: [RF-CAT-001]
      x-dtos: [CategoriaResumenDto (propuesto; DTO no definido)]
      x-domain-entities: [Categoria]
      x-application-port: CatalogQueryPort (propuesto)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de categorías
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaPage'
              example:
                data:
                  - categoriaId: 3a4b5c6d-7e8f-4012-9abc-def012345678
                    codigo: ABAR
                    nombre: Abarrotes
                    activa: true
                pagination:
                  page: 1
                  pageSize: 20
                  totalItems: 1
                  totalPages: 1
        default:
          $ref: '#/components/responses/CommonErrors'

  /api/v1/catalog/products:
    post:
      operationId: crearProducto
      tags: [Catalogo]
      summary: Registrar producto
      description: |
        Crea un producto con su precio inicial. Los códigos de unidad y afectación
        tributaria quedan sujetos a catálogos oficiales vigentes por verificar.
      x-requirements: [RF-CAT-001, RF-CAT-002, RF-CAT-003, RF-CAT-004]
      x-dtos:
        - CrearProductoComandoDto (existente; pendiente de reconciliar)
        - ProductoResumenDto (existente)
      x-domain-entities: [Producto, Categoria, EscalaPrecio]
      x-application-port: ProductCatalogCommandPort (propuesto)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearProductoComandoDto'
            example:
              sku: ARROZ-001
              nombre: Arroz
              categoriaId: 3a4b5c6d-7e8f-4012-9abc-def012345678
              unidadMedida: NIU
              afectacionIgvDefecto: '10'
              esPerecible: false
              escalasPrecioIniciales:
                - tipoEscala: MINORISTA_ESTANDAR
                  cantidadMinima: 1
                  precioUnitarioConIgv: 10.5
                  moneda: PEN
                  fechaInicio: '2026-10-22'
      responses:
        '201':
          description: Producto registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponse'
              example:
                data:
                  productoId: 5c6d7e8f-9012-4234-bcde-f01234567890
                  sku: ARROZ-001
                  nombre: Arroz
                  unidadMedida: NIU
                  esPerecible: false
                  activo: true
                metadata:
                  correlationId: 7e8f9012-3456-4789-abcd-ef0123456789
                  timestamp: '2026-10-22T15:00:00Z'
        '200':
          $ref: '#/components/responses/IdempotentReplay'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/CommonErrors'
    get:
      operationId: listarProductos
      tags: [Catalogo]
      summary: Buscar y listar productos
      x-requirements: [RF-CAT-001]
      x-dtos: [ProductoResumenDto (existente)]
      x-domain-entities: [Producto, EscalaPrecio]
      x-application-port: ProductCatalogQueryPort (propuesto)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: texto
          in: query
          description: Búsqueda por SKU, código de barras o nombre.
          schema:
            type: string
            maxLength: 100
        - name: categoriaId
          in: query
          schema:
            type: string
            format: uuid
        - name: activo
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Página de productos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPage'
        default:
          $ref: '#/components/responses/CommonErrors'

  /api/v1/catalog/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: obtenerProducto
      tags: [Catalogo]
      summary: Consultar producto por identificador
      x-requirements: [RF-CAT-001]
      x-dtos: [ProductoResumenDto (existente)]
      x-domain-entities: [Producto, Categoria, EscalaPrecio]
      x-application-port: ProductCatalogQueryPort (propuesto)
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/CommonErrors'
    patch:
      operationId: actualizarProducto
      tags: [Catalogo]
      summary: Actualizar datos permitidos del producto
      description: |
        La propuesta restringe los cambios a datos descriptivos y estado lógico.
        SKU e historial no se modifican. El conjunto exacto de campos editables
        debe aprobarse junto con el modelo y el DTO de actualización.
      x-status: proposed
      x-requirements: [RF-CAT-001, RF-CAT-002]
      x-dtos: [ActualizarProductoComandoDto (propuesto; DTO no definido)]
      x-domain-entities: [Producto]
      x-application-port: ProductCatalogCommandPort (propuesto)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarProductoComandoDto'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/CommonErrors'

  /api/v1/catalog/price-tiers:
    post:
      operationId: registrarCambioEscalaPrecio
      tags: [Catalogo]
      summary: Registrar nueva vigencia de una escala de precio
      description: |
        Registra un cambio de precio con motivo y vigencia para conservar la
        trazabilidad histórica. La semántica exacta de versionado y prevención
        de rangos de vigencia solapados debe aprobarse.
      x-status: proposed
      x-requirements: [RF-CAT-002, RF-TRZ-003]
      x-dtos:
        - ActualizarEscalaPrecioComandoDto (existente; verificar si es alta/versionado o actualización)
        - EscalaPrecioResponse (propuesto; DTO de salida no definido)
      x-domain-entities: [Producto, EscalaPrecio, Usuario]
      x-application-port: ProductCatalogCommandPort (propuesto)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarEscalaPrecioComandoDto'
            example:
              productoId: 5c6d7e8f-9012-4234-bcde-f01234567890
              tipoEscala: MINORISTA_ESTANDAR
              cantidadMinima: 1
              nuevoPrecioUnitarioConIgv: 11
              moneda: PEN
              fechaInicioVigencia: '2026-11-01'
              motivoModificacion: Actualización de lista comercial
      responses:
        '201':
          description: Nueva vigencia registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalaPrecioResponse'
        '200':
          $ref: '#/components/responses/IdempotentReplay'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        default:
          $ref: '#/components/responses/CommonErrors'

  /api/v1/inventory/warehouses:
    get:
      operationId: listarAlmacenes
      tags: [Inventario]
      summary: Listar almacenes
      x-requirements: [RF-ALM-001]
      x-dtos: [AlmacenResumenDto (propuesto; DTO no definido)]
      x-domain-entities: [Almacen]
      x-application-port: WarehouseQueryPort (propuesto)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de almacenes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlmacenPage'
        default:
          $ref: '#/components/responses/CommonErrors'

  /api/v1/inventory/stocks:
    get:
      operationId: consultarExistencias
      tags: [Inventario]
      summary: Consultar existencias por almacén y producto
      x-requirements: [RF-ALM-001, RF-ALM-002]
      x-dtos: [StockDisponibilidadDto (existente)]
      x-domain-entities: [StockAlmacen, Producto, Almacen]
      x-application-port: StockQueryPort (propuesto)
      parameters:
        - name: almacenId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: productoId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Existencias disponibles; el servidor calcula cantidades y costos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockPage'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/CommonErrors'

  /api/v1/inventory/receipts:
    post:
      operationId: registrarRecepcion
      tags: [Inventario]
      summary: Registrar recepción de mercadería
      description: Registra líneas recibidas; la actualización de existencias y los asientos de Kardex deben ser atómicos.
      x-requirements: [RF-ALM-003, RF-ALM-002, RF-CAT-004, RF-TRZ-002]
      x-dtos: [RegistrarEntradaMercaderiaComandoDto (existente)]
      x-domain-entities: [RecepcionMercaderia, DetalleRecepcion, MovimientoInventario, StockAlmacen, Lote]
      x-application-port: StockManagementServicePort (arquitectura existente; firma pendiente)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarEntradaMercaderiaComandoDto'
            example:
              almacenId: 3a4b5c6d-7e8f-4012-9abc-def012345678
              proveedorId: 4b5c6d7e-8f90-4123-abcd-ef0123456789
              documentoSustento:
                tipoComprobante: '01'
                serie: F001
                numero: '000123'
                fechaEmisionComprobante: '2026-10-22'
              items:
                - productoId: 5c6d7e8f-9012-4234-bcde-f01234567890
                  cantidadRecibida: 10
                  costoUnitarioSinIgv: 5
      responses:
        '201':
          description: Recepción registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecepcionResponse'
        '200':
          $ref: '#/components/responses/IdempotentReplay'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/CommonErrors'
    get:
      operationId: listarRecepciones
      tags: [Inventario]
      summary: Listar recepciones
      x-requirements: [RF-ALM-003]
      x-dtos: [RecepcionResumenDto (propuesto; DTO no definido)]
      x-domain-entities: [RecepcionMercaderia]
      x-application-port: StockQueryPort (propuesto)
      parameters:
        - name: proveedorId
          in: query
          schema:
            type: string
            format: uuid
        - name: almacenId
          in: query
          schema:
            type: string
            format: uuid
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de recepciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecepcionPage'
        default:
          $ref: '#/components/responses/CommonErrors'

  /api/v1/inventory/receipts/{receiptId}:
    get:
      operationId: obtenerRecepcion
      tags: [Inventario]
      summary: Consultar recepción y detalles
      x-requirements: [RF-ALM-003, RF-TRZ-001]
      x-dtos: [RecepcionDetalleDto (propuesto; DTO no definido)]
      x-domain-entities: [RecepcionMercaderia, DetalleRecepcion, MovimientoInventario]
      x-application-port: StockQueryPort (propuesto)
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
      responses:
        '200':
          description: Recepción y sus líneas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecepcionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/CommonErrors'

  /api/v1/inventory/movements:
    get:
      operationId: listarMovimientosInventario
      tags: [Inventario]
      summary: Consultar movimientos de inventario
      x-requirements: [RF-ALM-002, RF-ALM-004, RF-TRZ-001]
      x-dtos: [MovimientoInventarioResumenDto (propuesto; DTO no definido)]
      x-domain-entities: [MovimientoInventario, Producto, Almacen, Lote]
      x-application-port: StockQueryPort (propuesto)
      parameters:
        - name: almacenId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: productoId
          in: query
          schema:
            type: string
            format: uuid
        - name: desde
          in: query
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Movimientos paginados en orden cronológico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovimientoPage'
        default:
          $ref: '#/components/responses/CommonErrors'

  /api/v1/inventory/lots:
    get:
      operationId: listarLotes
      tags: [Inventario]
      summary: Consultar lotes y vencimientos
      description: Operación aplicable solo si se confirma el control de lotes para productos perecibles.
      x-status: pending-confirmation
      x-requirements: [RF-CAT-004]
      x-dtos: [LoteResumenDto (propuesto; DTO no definido)]
      x-domain-entities: [Lote, Producto, Almacen]
      x-application-port: LotQueryPort (propuesto)
      parameters:
        - name: almacenId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: productoId
          in: query
          schema:
            type: string
            format: uuid
        - name: venceAntesDe
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lotes que cumplen los filtros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotePage'
        default:
          $ref: '#/components/responses/CommonErrors'

  /api/v1/inventory/transfers:
    post:
      operationId: registrarTransferencia
      tags: [Inventario]
      summary: Registrar traslado entre almacenes
      description: La propuesta requiere completar el ciclo de despacho y recepción; el contrato de transferencia existente no define ambas fases ni discrepancias.
      x-status: proposed
      x-requirements: [RF-ALM-005, RF-ALM-002]
      x-dtos: [TransferirStockInteralmacenComandoDto (existente; insuficiente para confirmar recepción)]
      x-domain-entities: [Almacen, StockAlmacen, MovimientoInventario, Lote]
      x-application-port: StockManagementServicePort (arquitectura existente; firma pendiente)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferirStockInteralmacenComandoDto'
      responses:
        '201':
          description: Traslado iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferenciaResponse'
        '200':
          $ref: '#/components/responses/IdempotentReplay'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/CommonErrors'

  /api/v1/inventory/adjustments:
    post:
      operationId: registrarAjusteInventario
      tags: [Inventario]
      summary: Registrar ajuste de inventario
      description: Ajuste justificado sujeto a autorización del rol que apruebe el responsable del negocio.
      x-status: proposed
      x-requirements: [RF-ALM-006, RF-ALM-002, RF-TRZ-003]
      x-dtos: [RegistrarAjusteInventarioComandoDto (existente)]
      x-domain-entities: [StockAlmacen, MovimientoInventario, Usuario]
      x-application-port: StockManagementServicePort (arquitectura existente; firma pendiente)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarAjusteInventarioComandoDto'
      responses:
        '201':
          description: Ajuste registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovimientoResponse'
        '200':
          $ref: '#/components/responses/IdempotentReplay'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/CommonErrors'

  /api/v1/directory/customers:
    post:
      operationId: registrarCliente
      tags: [Directorio]
      summary: Registrar cliente
      x-requirements: [RF-DIR-001, RF-DIR-003]
      x-dtos: [RegistrarClienteComandoDto (existente)]
      x-domain-entities: [Cliente]
      x-application-port: CustomerDirectoryCommandPort (propuesto)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarClienteComandoDto'
      responses:
        '201':
          description: Cliente registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '200':
          $ref: '#/components/responses/IdempotentReplay'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/CommonErrors'
    get:
      operationId: listarClientes
      tags: [Directorio]
      summary: Listar y filtrar clientes
      x-requirements: [RF-DIR-001]
      x-dtos: [ClienteResumenDto (propuesto; DTO no definido)]
      x-domain-entities: [Cliente]
      x-application-port: CustomerDirectoryQueryPort (propuesto)
      parameters:
        - name: tipoDocumentoIdentidad
          in: query
          schema:
            type: string
        - name: numeroDocumento
          in: query
          schema:
            type: string
        - name: tipoCliente
          in: query
          schema:
            type: string
            enum: [MINORISTA, MAYORISTA]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientePage'
        default:
          $ref: '#/components/responses/CommonErrors'

  /api/v1/directory/customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      operationId: obtenerCliente
      tags: [Directorio]
      summary: Consultar cliente
      x-requirements: [RF-DIR-001]
      x-dtos: [ClienteResumenDto (propuesto; DTO no definido)]
      x-domain-entities: [Cliente]
      x-application-port: CustomerDirectoryQueryPort (propuesto)
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/CommonErrors'
    patch:
      operationId: actualizarCliente
      tags: [Directorio]
      summary: Actualizar datos permitidos del cliente
      description: DTO y lista de campos modificables pendientes de definición y validación.
      x-status: proposed
      x-requirements: [RF-DIR-001, RF-DIR-003]
      x-dtos: [ActualizarClienteComandoDto (propuesto; DTO no definido)]
      x-domain-entities: [Cliente]
      x-application-port: CustomerDirectoryCommandPort (propuesto)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarClienteComandoDto'
      responses:
        '200':
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/CommonErrors'

  /api/v1/directory/suppliers:
    post:
      operationId: registrarProveedor
      tags: [Directorio]
      summary: Registrar proveedor
      x-status: proposed
      x-requirements: [RF-DIR-002]
      x-dtos: [RegistrarProveedorComandoDto (propuesto; DTO no definido)]
      x-domain-entities: [Proveedor]
      x-application-port: SupplierDirectoryCommandPort (propuesto)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarProveedorComandoDto'
      responses:
        '201':
          description: Proveedor registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProveedorResponse'
        '200':
          $ref: '#/components/responses/IdempotentReplay'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/CommonErrors'
    get:
      operationId: listarProveedores
      tags: [Directorio]
      summary: Listar y filtrar proveedores
