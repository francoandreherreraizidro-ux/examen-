openapi: 3.1.0
info:
  title: API del sistema comercial
  version: 0.1.0
  description: |
    Borrador de contrato para revisión. SPEC-002 y los requisitos permanecen
    en estado de propuesta. Este documento no autoriza implementación ni
    afirma cumplimiento tributario o aceptación por SUNAT.
    Las rutas están versionadas bajo /api/v1. El host, autenticación,
    permisos, política de paginación y reglas operativas deben aprobarse.

paths:
  /api/v1/productos:
    get:
      operationId: listarProductos
      summary: Listar productos
      description: Consulta paginada del catálogo. Filtros y ordenamiento quedan pendientes.
      x-requirements: [RF-PRO-001]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: busqueda
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Página de productos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductosPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: crearProducto
      summary: Registrar producto
      x-requirements: [RF-PRO-001]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/CrearProductoDto'
      responses:
        '201':
          description: Producto registrado.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/ProductoDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/productos/{productoId}:
    get:
      operationId: obtenerProducto
      summary: Consultar producto
      x-requirements: [RF-PRO-001]
      parameters:
        - $ref: '#/components/parameters/ProductoId'
      responses:
        '200':
          description: Producto encontrado.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/ProductoDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: actualizarProducto
      summary: Actualizar datos descriptivos del producto
      description: No permite modificar identificadores, precios, estado ni datos fiscales en este borrador.
      x-requirements: [RF-PRO-001]
      x-status: proposed
      parameters:
        - $ref: '#/components/parameters/ProductoId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/ActualizarProductoDto'
      responses:
        '200':
          description: Producto actualizado.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/ProductoDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/almacenes:
    get:
      operationId: listarAlmacenes
      summary: Listar almacenes
      x-requirements: [RF-INV-001]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de almacenes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlmacenesPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: crearAlmacen
      summary: Registrar almacén
      description: Operación propuesta para cubrir la gestión de almacenes; revisar con el responsable.
      x-requirements: [RF-INV-001]
      x-status: proposed
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/CrearAlmacenDto'
      responses:
        '201':
          description: Almacén registrado.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/AlmacenDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/almacenes/{almacenId}:
    get:
      operationId: obtenerAlmacen
      summary: Consultar almacén
      x-requirements: [RF-INV-001]
      parameters:
        - $ref: '#/components/parameters/AlmacenId'
      responses:
        '200':
          description: Almacén encontrado.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/AlmacenDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: actualizarAlmacen
      summary: Actualizar datos descriptivos del almacén
      description: No permite alterar movimientos ni saldos históricos.
      x-requirements: [RF-INV-001]
      x-status: proposed
      parameters:
        - $ref: '#/components/parameters/AlmacenId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/ActualizarAlmacenDto'
      responses:
        '200':
          description: Almacén actualizado.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/AlmacenDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/inventario/movimientos:
    get:
      operationId: listarMovimientosInventario
      summary: Consultar historial de movimientos
      x-requirements: [RF-INV-002, RF-TRZ-001]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: productoId
          in: query
          required: false
          schema:
            $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/Identificador'
        - name: almacenId
          in: query
          required: false
          schema:
            $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/Identificador'
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Página de movimientos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovimientosPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: registrarMovimientoInventario
      summary: Registrar movimiento de inventario
      description: |
        Solicita el registro de un evento de inventario no originado por una
        venta: la propuesta limita esta operación a entradas y ajustes. Las
        salidas de venta se generarían exclusivamente al confirmar la venta.
        El catálogo de tipos, anulaciones/reversiones y reglas de saldo sigue
        pendiente de aprobación.
      x-requirements: [RF-INV-002, RF-VAL-001]
      x-status: proposed
      x-pending-decisions:
        - Aprobar que la confirmación de venta sea la única fuente de sus salidas.
        - Definir tipos/orígenes para entradas, ajustes y anulaciones/reversiones.
        - Definir cómo se liga una reversión a su movimiento original.
        - Definir signo, stock insuficiente y política de correcciones históricas.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/RegistrarMovimientoInventarioDto'
      responses:
        '201':
          description: Movimiento registrado.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/MovimientoInventarioDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/inventario/movimientos/{movimientoId}:
    get:
      operationId: obtenerMovimientoInventario
      summary: Consultar movimiento de inventario
      x-requirements: [RF-INV-002, RF-TRZ-001]
      parameters:
        - $ref: '#/components/parameters/MovimientoId'
      responses:
        '200':
          description: Movimiento encontrado.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/MovimientoInventarioDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/clientes:
    get:
      operationId: listarClientes
      summary: Listar clientes
      x-requirements: [RF-COM-001]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: busqueda
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Página de clientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TercerosPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: crearCliente
      summary: Registrar cliente
      x-requirements: [RF-COM-001]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/CrearClienteDto'
      responses:
        '201':
          description: Cliente registrado.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/TerceroDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/clientes/{clienteId}:
    get:
      operationId: obtenerCliente
      summary: Consultar cliente
      x-requirements: [RF-COM-001]
      parameters:
        - $ref: '#/components/parameters/ClienteId'
      responses:
        '200':
          description: Cliente encontrado.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/TerceroDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: actualizarCliente
      summary: Actualizar datos descriptivos del cliente
      description: No modifica el identificador comercial ni datos históricos en este borrador.
      x-requirements: [RF-COM-001]
      x-status: proposed
      parameters:
        - $ref: '#/components/parameters/ClienteId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/ActualizarTerceroDto'
      responses:
        '200':
          description: Cliente actualizado.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/TerceroDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/proveedores:
    get:
      operationId: listarProveedores
      summary: Listar proveedores
      x-requirements: [RF-COM-001]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: busqueda
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Página de proveedores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TercerosPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: crearProveedor
      summary: Registrar proveedor
      x-requirements: [RF-COM-001]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/CrearProveedorDto'
      responses:
        '201':
          description: Proveedor registrado.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/TerceroDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/proveedores/{proveedorId}:
    get:
      operationId: obtenerProveedor
      summary: Consultar proveedor
      x-requirements: [RF-COM-001]
      parameters:
        - $ref: '#/components/parameters/ProveedorId'
      responses:
        '200':
          description: Proveedor encontrado.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/TerceroDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: actualizarProveedor
      summary: Actualizar datos descriptivos del proveedor
      description: No modifica el identificador comercial ni datos históricos en este borrador.
      x-requirements: [RF-COM-001]
      x-status: proposed
      parameters:
        - $ref: '#/components/parameters/ProveedorId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/ActualizarTerceroDto'
      responses:
        '200':
          description: Proveedor actualizado.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/TerceroDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/ventas:
    get:
      operationId: listarVentas
      summary: Listar ventas
      x-requirements: [RF-VEN-001]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: clienteId
          in: query
          required: false
          schema:
            $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/Identificador'
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Página de ventas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VentasPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: crearVenta
      summary: Registrar venta
      description: |
        Crea un registro inicial de venta sin contabilizar inventario.
        Canal, precios, pago y las reglas de inventario siguen pendientes.
      x-requirements: [RF-VEN-001, RF-VAL-001]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/CrearVentaDto'
      responses:
        '201':
          description: Venta registrada.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/VentaDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/ventas/{ventaId}:
    get:
      operationId: obtenerVenta
      summary: Consultar venta
      x-requirements: [RF-VEN-001, RF-TRZ-001]
      parameters:
        - $ref: '#/components/parameters/VentaId'
      responses:
        '200':
          description: Venta encontrada.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/VentaDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/ventas/{ventaId}/confirmar:
    post:
      operationId: confirmarVenta
      summary: Confirmar venta y aplicar sus movimientos de inventario
      description: |
        Propuesta de transición explícita. La confirmación y todos los
        movimientos asociados se persisten atómicamente: se completan
        todos o no se confirma la venta. No se asigna comportamiento para
        existencias insuficientes hasta aprobar esa política.
      x-requirements: [RF-VEN-001, RF-VEN-002, RF-INV-002, RF-TRZ-001]
      x-status: proposed
      parameters:
        - $ref: '#/components/parameters/VentaId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/ConfirmarVentaDto'
      responses:
        '200':
          description: Venta confirmada y efecto de inventario registrado.
          content:
            application/json:
              schema:
                $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/VentaDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/comprobantes:
    post:
      operationId: solicitarEmisionComprobante
      summary: Solicitar emisión de comprobante
      description: |
        Registra una solicitud ligada a una venta. La respuesta 202 indica
        recepción de la solicitud, no envío ni aceptación de SUNAT. La
        asociación con Venta se propone a partir de RF-VEN-002 y debe confirmarse.
      x-requirements: [RF-CPE-001, RF-SUN-001, RF-VEN-002]
      x-status: proposed
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/SolicitarEmisionComprobanteDto'
      responses:
        '202':
          description: Solicitud registrada para procesamiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudEmisionAceptada'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/comprobantes/{comprobanteId}:
    get:
      operationId: obtenerComprobante
      summary: Consultar comprobante y resultado de integración
      description: Distingue el estado local del resultado externo, si existe.
      x-requirements: [RF-CPE-001, RF-SUN-001, RF-TRZ-001]
      parameters:
        - $ref: '#/components/parameters/ComprobanteId'
      responses:
        '200':
          description: Estado actual del documento y resultado externo disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComprobanteConsulta'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Encabezado opcional de una propuesta de idempotencia para comandos
        POST. Si se aprueba su garantía, la misma clave y el mismo contenido
        en el mismo ámbito no deben repetir el efecto; reutilizarla con
        contenido distinto debe producir conflicto. El ámbito, la
        obligatoriedad, el estado de solicitudes en curso y la retención
        están pendientes de aprobación. No se aplica a los PATCH descriptivos
        del borrador ni sustituye la reconciliación de reintentos SUNAT.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Page:
      name: pagina
      in: query
      required: false
      description: Parámetro de paginación propuesto; valor inicial 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: tamanoPagina
      in: query
      required: false
      description: Límite propuesto; valor inicial 20 y máximo 100, sujeto a aprobación.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ProductoId:
      name: productoId
      in: path
      required: true
      schema:
        $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/Identificador'
    AlmacenId:
      name: almacenId
      in: path
      required: true
      schema:
        $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/Identificador'
    MovimientoId:
      name: movimientoId
      in: path
      required: true
      schema:
        $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/Identificador'
    ClienteId:
      name: clienteId
      in: path
      required: true
      schema:
        $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/Identificador'
    ProveedorId:
      name: proveedorId
      in: path
      required: true
      schema:
        $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/Identificador'
    VentaId:
      name: ventaId
      in: path
      required: true
      schema:
        $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/Identificador'
    ComprobanteId:
      name: comprobanteId
      in: path
      required: true
      schema:
        $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/Identificador'

  responses:
    BadRequest:
      description: Solicitud mal formada o que no cumple la estructura del contrato.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso inexistente.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicto de estado, duplicidad o concurrencia.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BusinessRuleViolation:
      description: La operación no cumple una regla de negocio acordada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Error inesperado; no debe exponer detalles internos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: Perfil de Problem Details propuesto; confirmar antes de aprobar.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Código interno opcional; no es un código de SUNAT.
        invalidParams:
          type: array
          items:
            type: object
            required: [name, reason]
            properties:
              name:
                type: string
              reason:
                type: string
            additionalProperties: false
      additionalProperties: true

    PageMetadata:
      type: object
      required: [pagina, tamanoPagina]
      properties:
        pagina:
          type: integer
          minimum: 1
        tamanoPagina:
          type: integer
          minimum: 1
          maximum: 100
        totalElementos:
          type: integer
          minimum: 0
          description: Campo propuesto; disponibilidad/costo del conteo requiere confirmar.
      additionalProperties: false

    ProductosPage:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos:
          type: array
          items:
            $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/ProductoDto'
        paginacion:
          $ref: '#/components/schemas/PageMetadata'
      additionalProperties: false

    AlmacenesPage:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos:
          type: array
          items:
            $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/AlmacenDto'
        paginacion:
          $ref: '#/components/schemas/PageMetadata'
      additionalProperties: false

    MovimientosPage:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos:
          type: array
          items:
            $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/MovimientoInventarioDto'
        paginacion:
          $ref: '#/components/schemas/PageMetadata'
      additionalProperties: false

    TercerosPage:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos:
          type: array
          items:
            $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/TerceroDto'
        paginacion:
          $ref: '#/components/schemas/PageMetadata'
      additionalProperties: false

    VentasPage:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos:
          type: array
          items:
            $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/VentaDto'
        paginacion:
          $ref: '#/components/schemas/PageMetadata'
      additionalProperties: false

    SolicitudEmisionAceptada:
      type: object
      required: [comprobanteId, ventaId, estadoSolicitud]
      properties:
        comprobanteId:
          $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/Identificador'
        ventaId:
          $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/Identificador'
        estadoSolicitud:
          type: string
          const: recibida
          description: Confirma recepción de la solicitud, no envío ni aceptación externa.
      additionalProperties: false

    ComprobanteConsulta:
      type: object
      required: [comprobante, integracion]
      properties:
        comprobante:
          $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/ComprobanteDto'
        integracion:
          oneOf:
            - $ref: '../../03_DTOs_Schemas/dto-contracts.schema.json#/$defs/ResultadoIntegracionDto'
            - type: 'null'
          description: Nulo mientras no haya resultado externo disponible.
      additionalProperties: false
